<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Escáner Móvil de Asistencia</title>
  
  <!-- Enlace a tu archivo CSS externo -->
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header>
    <h1>Escáner Móvil</h1>
  </header>

  <main>
    <section class="card" id="lector">
      <h2>Lector de QR (Celular)</h2>
      
      <div id="reader" style="width: 100%; max-width: 320px; margin: 0 auto 15px auto; border-radius: 10px; overflow: hidden; background: #f0f0f0; min-height: 200px; display: flex; align-items: center; justify-content: center;"></div>
      
      <div style="text-align: center; margin-bottom: 15px;">
        <button type="button" id="btnCamara" onclick="toggleCamara()" style="padding: 8px 16px; font-weight: bold; cursor: pointer;">Iniciar Cámara</button>
      </div>

      <label for="inputLector">Escriba el código o use lector manual:</label>
      <input type="text" id="inputLector" placeholder="Pase el carnet o escriba aquí..." autofocus autocomplete="off">
      <div id="mensaje" class="mensaje"></div>
    </section>
  </main>

  <!-- Librería para escanear con la cámara web -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <!-- Script del Escáner conectado a Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, set, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // 🔑 CONFIGURACIÓN DE FIREBASE (Debe ser EXACTAMENTE LA MISMA que pusiste en el index.html)
    const firebaseConfig = {
      apiKey: "TU_API_KEY",
      authDomain: "tu-proyecto.firebaseapp.com",
      databaseURL: "https://tu-proyecto-default-rtdb.firebaseio.com",
      projectId: "tu-proyecto",
      storageBucket: "tu-proyecto.appspot.com",
      messagingSenderId: "TU_MESSAGING_SENDER_ID",
      appId: "TU_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const inputLector = document.getElementById("inputLector");
    const mensaje = document.getElementById("mensaje");

    let html5QrCode = null;
    let camaraActiva = false;
    let escaneando = false;

    function fechaHoy() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    }
    function horaAhora() {
      return new Date().toLocaleTimeString("es-CO", { hour12: false });
    }

    function mostrarMensaje(texto, tipo) {
      mensaje.textContent = texto;
      mensaje.className = `mensaje ${tipo}`;
      setTimeout(() => (mensaje.className = "mensaje"), 3500);
    }

    // Registrar asistencia directo a Firebase para que la PC lo reciba al instante
    window.registrarAsistencia = async function(codigo) {
      const refEstudiantes = ref(db, 'estudiantes');
      const snapEstudiantes = await get(refEstudiantes);
      const estudiantes = snapEstudiantes.val() ? Object.values(snapEstudiantes.val()) : [];

      const est = estudiantes.find(e => e.codigo === codigo);
      if (!est) return mostrarMensaje(`Código no reconocido: ${codigo}`, "error");

      const refAsistencias = ref(db, 'asistencias');
      const snapAsistencias = await get(refAsistencias);
      const asistenciasObj = snapAsistencias.val() || {};
      const listaAsistencias = Object.values(asistenciasObj);
      const fecha = fechaHoy();

      if (listaAsistencias.some(a => a.codigo === codigo && a.fecha === fecha)) {
        return mostrarMensaje(`${est.nombre} ya registró su ingreso hoy.`, "aviso");
      }

      const hora = horaAhora();
      const nuevaAsistenciaRef = push(refAsistencias);
      await set(nuevaAsistenciaRef, { codigo, nombre: est.nombre, fecha, hora });

      mostrarMensaje(`✔ ${est.nombre} — ingreso registrado a las ${hora}`, "ok");
    }

    window.toggleCamara = function() {
      const btn = document.getElementById("btnCamara");
      
      if (!camaraActiva) {
        if (!html5QrCode) {
          html5QrCode = new Html5Qrcode("reader");
        }
        
        const config = { fps: 10, qrbox: { width: 220, height: 220 } };
        
        html5QrCode.start(
          { facingMode: "environment" }, 
          config,
          (codigoEscaneado) => {
            if (!escaneando) {
              escaneando = true;
              registrarAsistencia(codigoEscaneado.trim().toUpperCase());
              setTimeout(() => { escaneando = false; }, 2500);
            }
          },
          (error) => {}
        ).then(() => {
          camaraActiva = true;
          btn.textContent = "Detener Cámara";
        }).catch(err => {
          mostrarMensaje("No se pudo acceder a la cámara. Revisa los permisos.", "error");
        });

      } else {
        html5QrCode.stop().then(() => {
          camaraActiva = false;
          btn.textContent = "Iniciar Cámara";
          document.getElementById("reader").innerHTML = "<p style='color:#777;'>Cámara apagada</p>";
        }).catch(err => console.log(err));
      }
    }

    inputLector.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        const codigo = inputLector.value.trim().toUpperCase();
        inputLector.value = "";
        if (codigo) registrarAsistencia(codigo);
      }
    });

    window.addEventListener("DOMContentLoaded", () => {
      inputLector.focus();
      document.getElementById("reader").innerHTML = "<p style='color:#777;'>Cámara lista</p>";
    });
  </script>
</body>
</html>
